[package]
name = "simplekanainput"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.81"
jmdict = { git = "https://github.com/crumblingstatue/rust-jmdict.git", features = [
    "scope-uncommon",
    "scope-archaic",
] }
mugo = { git = "https://github.com/crumblingstatue/mugo.git", features = ["labels"] }
egui_extras = { version = "0.37", default-features = false }
egui_commonmark = {version = "0.26.0", default-features = false, features = [
    "pulldown_cmark",
] }
egui_colors = "0.14.0"
existing_instance = { git = "https://github.com/crumblingstatue/rust-existing-instance.git" }
mugo-jmdict = { git = "https://github.com/crumblingstatue/mugo-jmdict.git" }
ids_rust.git = "https://github.com/crumblingstatue/ids_rust_lib.git"
rand = "0.10"
strsim = "0.11.1"
egui_system_font_frog.git = "https://github.com/crumblingstatue/egui_system_font_frog.git"

# sf2g backend
egui-sf2g = { version = "0.10" }
sf2g-xt = { version = "0.4" }
arboard = { version = "3.6.0" }

# Compile deps with optimizations in dev mode
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
vergen-gitcl = { version = "10.0", default-features = false, features = ["build", "cargo", "rustc"] }
